name: Build Mini Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create . --platforms=android

      - name: Fix Kotlin version
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*" apply false/id("org.jetbrains.kotlin.android") version "2.3.0" apply false/' android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*" apply false/id "org.jetbrains.kotlin.android" version "2.3.0" apply false/' android/settings.gradle
          fi

      - name: Fix Kotlin compiler options
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
            from pathlib import Path

            p = Path("android/app/build.gradle.kts")
            s = p.read_text()

            old = '''kotlinOptions {
                jvmTarget = JavaVersion.VERSION_11.toString()
            }'''

            new = '''kotlin {
                compilerOptions {
                    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                }
            }'''

            s = s.replace(old, new)
            p.write_text(s)
            PY
          fi

      - name: Add Firebase packages
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth

      - name: Add Firebase configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          if [ -f android/settings.gradle.kts ]; then
            sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.4" apply false' android/settings.gradle.kts

            sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts

          elif [ -f android/settings.gradle ]; then
            sed -i '/id "dev.flutter.flutter-plugin-loader"/a\    id "com.google.gms.google-services" version "4.4.4" apply false' android/settings.gradle

            sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
